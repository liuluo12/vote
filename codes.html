<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2617班 · 口令领取墙</title>
<style>html,body{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;background:#f2f4f8;color:#16202e}
header{background:linear-gradient(135deg,#2f6bff,#00c2a8);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:21px}
.sub{margin-top:6px;font-size:13px;opacity:.92}
.pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px;margin-right:8px}
.wrap{padding:14px}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;outline:none;box-shadow:0 2px 8px rgba(20,40,80,.06)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:2px solid transparent;border-radius:14px;padding:14px 6px;text-align:center;font-size:15px;font-weight:600;color:#1b2a41;box-shadow:0 1px 4px rgba(20,40,80,.06);cursor:pointer;user-select:none;overflow-wrap:anywhere}
.card.on{border-color:#2f6bff;background:#eef3ff;color:#1a4fd6}
.card .idx{display:block;font-size:11px;font-weight:400;color:#9aa7bd;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid #e6eaf2;display:flex;align-items:center;gap:10px}
.sel{flex:1;font-size:14px;color:#5b6b84}
.sel b{color:#16202e;font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#00a6ff)}
.btn:disabled{background:#c9d3e4}
#done{display:none;text-align:center;padding:44px 20px}
.big{font-size:52px;margin:0 0 10px}
.thanks{font-size:18px;font-weight:700;color:#00a878}
.t2{color:#5b6b84;font-size:14px;margin-top:6px}
.rows{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 2px 10px rgba(20,40,80,.06);margin-top:14px}
.row{padding:11px 0;border-bottom:1px solid #f0f3f8}
.row:last-child{border-bottom:0}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.n{font-weight:600}
.v{color:#5b6b84;font-size:13px}
.bar{height:9px;border-radius:6px;background:#eef1f7;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6bff,#00c2a8);transition:width .4s}
.top{color:#d97706;font-size:12px;margin-left:6px;font-weight:700}
.empty{text-align:center;color:#93a1b7;padding:30px 0;font-size:14px}
.meta{color:#8a97ac;font-size:12px;margin-top:14px;line-height:1.7;word-break:break-all}
button.act{border:0;background:#2f6bff;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;margin-top:14px}
button.clear{background:#e5484d}
a.dl{color:#2f6bff;font-size:13px;margin-left:10px;text-decoration:none}
.dev{color:#93a1b7;font-size:11px;line-height:1.7;padding:16px 16px 0;word-break:break-all}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,50,.9);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}

body{background:#f2f4f8;color:#16202e;padding-bottom:20px}
.top{padding:14px;position:sticky;top:0;background:#f2f4f8;z-index:2}
.big{display:flex;align-items:baseline;gap:10px;margin:0 4px 10px}
.big b{font-size:26px;color:#2f6bff}
.big span{font-size:14px;color:#5b6b84}
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 14px}
.pcard{background:#fff;border:2px solid transparent;border-radius:14px;padding:12px 4px;text-align:center;
box-shadow:0 1px 4px rgba(20,40,80,.06);cursor:pointer;transition:.18s}
.pcard .k{font-size:19px;font-weight:800;letter-spacing:2px;color:#1b2a41}
.pcard .s{font-size:11px;color:#00a878;margin-top:3px}
.pcard.used{opacity:0;transform:scale(.6);pointer-events:none}
.pcard.pick{border-color:#2f6bff;background:#eef3ff}
.note{font-size:12px;color:#93a1b7;padding:14px 18px;line-height:1.8}
.used{font-size:12px;color:#93a1b7;margin:0 4px 8px}
.warn{background:#fff6e6;color:#a8570a;border-radius:12px;margin:0 14px 12px;padding:10px 12px;font-size:12px;line-height:1.7}
</style></head><body>
<div class="top">
  <div class="big"><b id="left">59</b><span>个口令还没人用</span></div>
  <div class="used" id="usedline"></div>
  <div class="warn">点一个还有效的口令 → 自动进入投票页。用掉后这张卡会消失，刷新不影响。</div>
</div>
<div class="pool" id="pool"><div class="note">加载中…</div></div>
<div class="note" id="meta"></div>
<script>
var BASE="2617vote-", CTL="2617vote-ctl";

function ctlLatest(){
  return fetch("https://ntfy.sh/"+CTL+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var out={reset:null,names:null,title:"",sub:""};
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event!=="message"||!m.message)return;
          var d=JSON.parse(m.message);
          if(d.event==="reset"&&m.id)out.reset=m.id;
          if(d.event==="names"&&Array.isArray(d.list)&&d.list.length)out.names=d.list;
          if(d.event==="config"){
            if(typeof d.title==="string")out.title=d.title;
            if(typeof d.sub==="string")out.sub=d.sub;
          }
        }catch(e){}
      });
      return out;
    });
}
function activeTopic(){
  return ctlLatest().then(function(i){return i.reset?(BASE+i.reset):null;});
}
function readVotes(topic){
  return fetch("https://ntfy.sh/"+topic+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var seen={},order=[];
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event!=="message"||!m.message)return;
          var d=JSON.parse(m.message);
          if(!d||typeof d!=="object")return;
          if(d.event==="reset")return;
          if(!d.h||!d.name||d.name==="undefined"||d.h==="undefined")return;
          if(!seen[d.h]){seen[d.h]={h:d.h,name:d.name,ts:d.ts||m.time*1000,dv:d.dv||"",md:d.md||"",imp:d.imp||0};order.push(seen[d.h]);}
        }catch(e){}
      });
      return order;
    });
}
function post(topic,obj){
  return fetch("https://ntfy.sh/"+topic,{method:"POST",body:JSON.stringify(obj)});
}
function byName(votes){
  var c={},i,v;
  for(i=0;i<votes.length;i++){v=votes[i];c[v.name]=(c[v.name]||0)+1;}
  return c;
}

function sha256hex(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result="",words=[],asciiBitLength=ascii.length*8;
  var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],primeCounter=k.length,isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while(ascii.length%64-56)ascii+="\x00";
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8)return;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++){
    for(var j2=3;j2+1;j2--){
      var b=(hash[i]>>(j2*8))&255;
      result+=((b<16)?"0":"")+b.toString(16);
    }
  }
  return result;
}
var CODES=["9W6JLT", "7K2UAL", "R6YW5C", "H6CAHF", "HNCQ4M", "R47H9G", "KEYK6F", "8YF992", "NR245Q", "3QCRVA", "EDDDBC", "5BM5VC", "M53G8S", "AFN8A6", "VRTAN5", "AHLYJD", "EQCD7M", "JYYYA2", "F68GSR", "848968", "KYK5DQ", "8FGJEB", "XG3KXA", "TWG4NM", "FXADQN", "3LBG8Y", "XNDUW5", "Z5GQAD", "YEJT9W", "HUG4NC", "2L8U2D", "LZ6KX7", "SY75F4", "P58PPN", "943DW2", "6NBHQ3", "M94YJA", "6R3MFN", "TC94LZ", "28JK6L", "A8WD54", "XJ72RQ", "NY8DNB", "KX8AXX", "X553CV", "583AYQ", "KCKLVE", "JTF3RH", "7KBTX7", "QDAN9N", "QEKA6N", "NJ86DD", "P9RFPB", "PE76RT", "FA9UD4", "D99C25", "PY9T5W", "LV2ZT8", "6WA5UK"];
var topic=null,votes=[],usedH={};
function $(i){return document.getElementById(i);}
function hashOf(c){return sha256hex(c);}
function claim(card,code){
  card.classList.add("pick");
  setTimeout(function(){location.href="index.html?v=18&c="+encodeURIComponent(code);},120);
}
function render(){
  var pool=$("pool");
  var free=CODES.filter(function(c){return !usedH[c];});
  var usedCount=CODES.length-free.length;
  pool.innerHTML=free.length?free.map(function(c){
    return '<div class="pcard" data-c="'+c+'"><div class="k">'+c+'</div><div class="s">点这里投票</div></div>';
  }).join(""):'<div class="note" style="grid-column:1/-1;text-align:center;padding:40px 0">口令已全部用完</div>';
  $("usedline").textContent=usedCount?("已用 "+usedCount+" 个（已隐藏）"):"";
  [].forEach.call(pool.querySelectorAll(".pcard"),function(el){
    el.onclick=function(){claim(el,el.dataset.c);};
  });
  $("left").textContent=free.length;
  $("meta").textContent="共 59 个口令，已用 "+(59-left)+" 个 ｜ 每 8 秒自动刷新 ｜ 轮次 "+topic;
}
function refresh(){
  if(!topic)return Promise.resolve();
  return readVotes(topic).then(function(v){
    votes=v;usedH={};
    var hs={};v.forEach(function(x){hs[x.h]=1;});
    CODES.forEach(function(c){ if(hs[hashOf(c)])usedH[c]=1; });
    render();
  }).catch(function(){});
}
function boot(){
  activeTopic().then(function(t){
    topic=t;refresh();
    setInterval(refresh,8000);
  }).catch(function(){$("pool").innerHTML='<div class="note">加载失败，请刷新页面</div>';});
}
try{boot();}catch(e){$("pool").innerHTML='<div class="note">初始化失败：'+e.message+'</div>';}
</script>
</body></html>
