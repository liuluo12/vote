<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2617班 · 票数后台</title>
<style>html,body{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;background:#f2f4f8;color:#16202e}
header{background:linear-gradient(135deg,#2f6bff,#00c2a8);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:21px}
.sub{margin-top:6px;font-size:13px;opacity:.92}
.pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px;margin-right:8px}
.wrap{padding:14px}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;outline:none;box-shadow:0 2px 8px rgba(20,40,80,.06)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:2px solid transparent;border-radius:14px;padding:14px 6px;text-align:center;font-size:15px;font-weight:600;color:#1b2a41;box-shadow:0 1px 4px rgba(20,40,80,.06);cursor:pointer;user-select:none;overflow-wrap:anywhere}
.card.on{border-color:#2f6bff;background:#eef3ff;color:#1a4fd6}
.card .idx{display:block;font-size:11px;font-weight:400;color:#9aa7bd;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid #e6eaf2;display:flex;align-items:center;gap:10px}
.sel{flex:1;font-size:14px;color:#5b6b84}
.sel b{color:#16202e;font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#00a6ff)}
.btn:disabled{background:#c9d3e4}
#done{display:none;text-align:center;padding:44px 20px}
.big{font-size:52px;margin:0 0 10px}
.thanks{font-size:18px;font-weight:700;color:#00a878}
.t2{color:#5b6b84;font-size:14px;margin-top:6px}
.rows{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 2px 10px rgba(20,40,80,.06);margin-top:14px}
.row{padding:11px 0;border-bottom:1px solid #f0f3f8}
.row:last-child{border-bottom:0}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.n{font-weight:600}
.v{color:#5b6b84;font-size:13px}
.bar{height:9px;border-radius:6px;background:#eef1f7;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6bff,#00c2a8);transition:width .4s}
.top{color:#d97706;font-size:12px;margin-left:6px;font-weight:700}
.empty{text-align:center;color:#93a1b7;padding:30px 0;font-size:14px}
.meta{color:#8a97ac;font-size:12px;margin-top:14px;line-height:1.7;word-break:break-all}
button.act{border:0;background:#2f6bff;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;margin-top:14px}
button.clear{background:#e5484d}
a.dl{color:#2f6bff;font-size:13px;margin-left:10px;text-decoration:none}
.dev{color:#93a1b7;font-size:11px;line-height:1.7;padding:16px 16px 0;word-break:break-all}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,50,.9);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}

header{background:linear-gradient(135deg,#1e2a3a,#2f6bff)}
main{padding:16px}
h2{font-size:15px;margin:20px 0 8px;color:#5b6b84}
code{background:#f0f3f8;padding:1px 5px;border-radius:4px;font-size:12px}
.hrow{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid #f0f3f8}
.hrow:last-child{border-bottom:0}
.mini{font-size:12px;color:#93a1b7}
.note{background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;color:#5b6b84;line-height:1.7;box-shadow:0 1px 4px rgba(20,40,80,.06)}
</style></head><body>
<header>
  <h1>2617班 · 票数后台</h1>
  <div class="sub">匿名口令投票 · 每 15 秒自动刷新</div>
  <div><span class="pill" id="total">已投 0 票</span><span class="pill" id="left">剩余口令 59</span><span class="pill" id="dev">0 台设备</span></div>
</header>
<main>
  <h2>得票排行</h2>
  <div class="rows" id="rows"><div class="empty">加载中…</div></div>
  <h2>投票情况</h2>
  <div class="note" id="note"></div>
  <div class="meta" id="meta"></div>
  <button class="act" id="reload">手动刷新</button>
  <a class="dl" id="dl" download="2617票数.csv">导出 CSV</a>
  <button class="act clear" id="clear">清空投票数据</button>

  <h2>数据导入</h2>
  <div class="note">
    <div style="line-height:1.9;font-size:13px">
      <b>① 投票记录</b>：每行 <code>姓名,票数</code>，票数可省略（默认 1）<br>
      <b>② 名单</b>：每行一个姓名（或 CSV 第一列），导入后同学刷新页面生效<br>
      <b>③ 历史结果</b>：粘贴之前导出的 CSV，用于和本轮对比
    </div>
    <textarea id="imp" placeholder="在这里粘贴内容，然后点下面某个按钮" style="width:100%;height:110px;margin-top:10px;border:1px solid #dfe6f1;border-radius:10px;padding:10px;font-size:13px"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="act" id="impVote">① 导入投票记录</button>
      <button class="act" id="impNames">② 导入名单</button>
      <button class="act" id="impHist">③ 导入历史结果</button>
      <button class="act clear" id="clrHist">清空历史对比</button>
    </div>
  </div>

  <h2>历史对比</h2>
  <div class="rows" id="hist"><div class="empty">还没有导入历史数据</div></div>
</main>
<script>
var BASE="2617vote-", CTL="2617vote-ctl";

function ctlLatest(){
  return fetch("https://ntfy.sh/"+CTL+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var out={reset:null,names:null};
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event!=="message"||!m.message)return;
          var d=JSON.parse(m.message);
          if(d.event==="reset"&&m.id)out.reset=m.id;
          if(d.event==="names"&&Array.isArray(d.list)&&d.list.length)out.names=d.list;
        }catch(e){}
      });
      return out;
    });
}
function activeTopic(){
  return ctlLatest().then(function(i){return i.reset?(BASE+i.reset):null;});
}
function readVotes(topic){
  return fetch("https://ntfy.sh/"+topic+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var seen={},order=[];
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event!=="message"||!m.message)return;
          var d=JSON.parse(m.message);
          if(!d||typeof d!=="object")return;
          if(d.event==="reset")return;
          if(!d.h||!d.name||d.name==="undefined"||d.h==="undefined")return;
          if(!seen[d.h]){seen[d.h]={h:d.h,name:d.name,ts:d.ts||m.time*1000,dv:d.dv||"",dup:d.dup||0};order.push(seen[d.h]);}
        }catch(e){}
      });
      return order;
    });
}
function post(topic,obj){
  return fetch("https://ntfy.sh/"+topic,{method:"POST",body:JSON.stringify(obj)});
}
function byName(votes){
  var c={},i,v;
  for(i=0;i<votes.length;i++){v=votes[i];c[v.name]=(c[v.name]||0)+1;}
  return c;
}

var topic=null,totalCodes=59;
function $(i){return document.getElementById(i);}
function render(v){
  var counts=byName(v),total=v.length;
  $("total").textContent="已投 "+total+" 票";
  $("left").textContent="剩余口令 "+(totalCodes-total>0?totalCodes-total:0);
  var items=Object.keys(counts).map(function(k){return [k,counts[k]];}).sort(function(a,b){return b[1]-a[1];});
  var max=items.length?items[0][1]:1;
  $("rows").innerHTML=items.length?items.map(function(x,i){
    var pct=total?(x[1]/total*100).toFixed(1):"0.0";
    return '<div class="row"><div class="rl"><span class="n">'+x[0]+(i===0?'<span class="top">领先</span>':'')+'</span><span class="v">'+x[1]+' 票 · '+pct+'%</span></div><div class="bar"><i style="width:'+(x[1]/max*100)+'%"></i></div></div>';
  }).join(""):'<div class="empty">还没有人投票</div>';
  var devCount={},uniq=0;
  v.forEach(function(x){ if(x.dv){ if(!devCount[x.dv]){devCount[x.dv]=[];uniq++;} devCount[x.dv].push(x.name); } });
  $("dev").textContent=uniq+" 台设备";
  var dupList=Object.keys(devCount).filter(function(k){return devCount[k].length>1;});
  var dupHtml=dupList.length
    ? "<div style='color:#e5484d;margin-top:8px'><b>⚠ 检测到同一台设备多次投票：</b><br>"+dupList.map(function(k){return "设备 "+k+" → "+devCount[k].join("、")+"（"+devCount[k].length+" 票）";}).join("<br>")+"</div>"
    : "<div style='color:#00a878;margin-top:8px'>✅ 未发现同一设备重复投票（按设备指纹判断，仅供参考）</div>";
  $("note").innerHTML="已使用口令 <b>"+total+"</b> 个，还剩 <b>"+(totalCodes-total>0?totalCodes-total:0)+"</b> 个未使用。<br>匿名投票：系统只记录口令，<b>不记录谁投了谁</b>，所以看不到“谁还没投”。<br>"+dupHtml;
  var last=v.slice().sort(function(a,b){return b.ts-a.ts;})[0];
  $("meta").textContent=(last?("最近一票："+new Date(last.ts).toLocaleString("zh-CN")+" · 投给 "+last.name):"等待第一票…")+"　|　轮次："+topic;
  renderHist(counts);
  $("dl").href="data:text/csv;charset=utf-8,"+encodeURIComponent("姓名,票数\\n"+items.map(function(x){return x[0]+","+x[1];}).join("\\n")+"\\n\\n已用口令,"+total+"\\n剩余口令,"+(totalCodes-total));
}
function load(){
  activeTopic().then(function(t){
    topic=t;
    if(!t){$("rows").innerHTML='<div class="empty">投票尚未开始</div>';return null;}
    return readVotes(t);
  }).then(function(v){if(v)render(v);})
   .catch(function(){$("rows").innerHTML='<div class="empty">加载失败，稍后自动重试</div>';});
}
function parseRows(text){
  var rows=[];
  String(text||"").split(/\r?\n/).forEach(function(line){
    line=line.replace(/^\s+|\s+$/g,"");
    if(!line)return;
    var parts=line.split(/[,\t]/).map(function(x){return x.replace(/^\s+|\s+$/g,"");});
    if(parts[0])rows.push(parts);
  });
  return rows;
}
function importVotes(){
  var rows=parseRows($("imp").value);
  if(!rows.length){alert("粘贴内容为空");return;}
  var tasks=[];
  rows.forEach(function(p){
    var name=p[0];
    if(!name||/^姓名$/.test(name))return;
    var cnt=parseInt(p[1]||"1",10);
    if(!(cnt>0))cnt=1;
    if(cnt>500)cnt=500;
    for(var k=0;k<cnt;k++)tasks.push(name);
  });
  if(!tasks.length){alert("没解析到有效数据");return;}
  if(!topic){alert("当前没有投票轮次");return;}
  if(!confirm("将导入 "+tasks.length+" 票到当前轮次，确定吗？"))return;
  var i=0,fail=0;
  function next(){
    if(i>=tasks.length){
      alert("导入完成："+(tasks.length-fail)+" 票成功"+(fail?("，"+fail+" 票失败"):""));
      $("imp").value="";
      load();
      return;
    }
    var nm=tasks[i++];
    post(topic,{h:"imp"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:nm,ts:Date.now(),dv:"",imp:1})
      .then(function(r){if(!r.ok)fail++;next();})
      .catch(function(){fail++;next();});
  }
  next();
}
function importNames(){
  var rows=parseRows($("imp").value);
  var list=rows.map(function(p){return p[0];}).filter(function(x){return x&&!/^姓名$/.test(x);});
  if(!list.length){alert("没解析到姓名");return;}
  if(!confirm("导入 "+list.length+" 个姓名作为候选名单？\n同学刷新投票页后生效。"))return;
  post(CTL,{event:"names",list:list,ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    alert("已导入 "+list.length+" 个姓名。\n让同学刷新投票页即可看到新名单。");
    $("imp").value="";
  }).catch(function(e){alert("导入失败："+e.message);});
}
function histKey(){return "hist_2617_v1";}
function getHist(){try{return JSON.parse(localStorage.getItem(histKey())||"[]");}catch(e){return [];}}
function importHistory(){
  var rows=parseRows($("imp").value);
  var data=[];
  rows.forEach(function(p){
    if(!p[0]||/^姓名$/.test(p[0]))return;
    var n=parseInt(p[1]||"0",10);
    if(isNaN(n))return;
    data.push([p[0],n]);
  });
  if(!data.length){alert("没解析到 姓名,票数 数据");return;}
  var h=getHist();
  h.unshift({ts:Date.now(),label:new Date().toLocaleString("zh-CN"),rows:data});
  h=h.slice(0,5);
  try{localStorage.setItem(histKey(),JSON.stringify(h));}catch(e){}
  $("imp").value="";
  alert("已导入历史结果："+data.length+" 人");
  load();
}
function renderHist(counts){
  var h=getHist(),box=$("hist");
  if(!h.length){box.innerHTML='<div class="empty">还没有导入历史数据</div>';return;}
  var latest=h[0],map={};
  latest.rows.forEach(function(r){map[r[0]]=r[1];});
  var names={};
  Object.keys(map).forEach(function(k){names[k]=1;});
  Object.keys(counts||{}).forEach(function(k){names[k]=1;});
  var list=Object.keys(names).sort(function(a,b){return (map[b]||0)-(map[a]||0);});
  box.innerHTML='<div class="mini" style="padding:6px 0">历史批次：'+latest.label+'（共 '+latest.rows.reduce(function(a,b){return a+b[1];},0)+' 票）</div>'+
    list.map(function(n){
      var old=map[n]||0,cur=(counts&&counts[n])||0,d=cur-old;
      var color=d>0?"#00a878":(d<0?"#e5484d":"#93a1b7");
      return '<div class="hrow"><span>'+n+'</span><span class="mini">历史 '+old+' ｜ 本轮 '+cur+' ｜ <b style="color:'+color+'">'+(d>0?"+":"")+d+'</b></span></div>';
    }).join("");
}
$("impVote").onclick=importVotes;
$("impNames").onclick=importNames;
$("impHist").onclick=importHistory;
$("clrHist").onclick=function(){
  if(!confirm("清空本机保存的历史对比数据？"))return;
  try{localStorage.removeItem(histKey());}catch(e){}
  load();
};
$("reload").onclick=load;
$("clear").onclick=function(){
  var b=this;
  if(!confirm("清空后所有票数归零，已用的口令也会作废。确定清空吗？"))return;
  if(!confirm("再确认一次：真的要清空本轮投票数据？"))return;
  b.disabled=true;b.textContent="清空中…";
  post(CTL,{event:"reset",ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);return activeTopic();
  }).then(function(t){topic=t;alert("已清空！投票页 15 秒内自动切到新一轮。\\n新轮次："+t);load();})
   .catch(function(e){alert("清空失败："+e.message);})
   .then(function(){b.disabled=false;b.textContent="清空投票数据";});
};
load();
setInterval(load,15000);
</script>
</body></html>
