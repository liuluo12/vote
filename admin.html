<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2617班 · 票数后台</title>
<style>html,body{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;background:#f2f4f8;color:#16202e}
header{background:linear-gradient(135deg,#2f6bff,#00c2a8);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:21px}
.sub{margin-top:6px;font-size:13px;opacity:.92}
.pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px;margin-right:8px}
.wrap{padding:14px}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;outline:none;box-shadow:0 2px 8px rgba(20,40,80,.06)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:2px solid transparent;border-radius:14px;padding:14px 6px;text-align:center;font-size:15px;font-weight:600;color:#1b2a41;box-shadow:0 1px 4px rgba(20,40,80,.06);cursor:pointer;user-select:none;overflow-wrap:anywhere}
.card.on{border-color:#2f6bff;background:#eef3ff;color:#1a4fd6}
.card .idx{display:block;font-size:11px;font-weight:400;color:#9aa7bd;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid #e6eaf2;display:flex;align-items:center;gap:10px}
.sel{flex:1;font-size:14px;color:#5b6b84}
.sel b{color:#16202e;font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#00a6ff)}
.btn:disabled{background:#c9d3e4}
#done{display:none;text-align:center;padding:44px 20px}
.big{font-size:52px;margin:0 0 10px}
.thanks{font-size:18px;font-weight:700;color:#00a878}
.t2{color:#5b6b84;font-size:14px;margin-top:6px}
.rows{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 2px 10px rgba(20,40,80,.06);margin-top:14px}
.row{padding:11px 0;border-bottom:1px solid #f0f3f8}
.row:last-child{border-bottom:0}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.n{font-weight:600}
.v{color:#5b6b84;font-size:13px}
.bar{height:9px;border-radius:6px;background:#eef1f7;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6bff,#00c2a8);transition:width .4s}
.top{color:#d97706;font-size:12px;margin-left:6px;font-weight:700}
.empty{text-align:center;color:#93a1b7;padding:30px 0;font-size:14px}
.meta{color:#8a97ac;font-size:12px;margin-top:14px;line-height:1.7;word-break:break-all}
button.act{border:0;background:#2f6bff;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;margin-top:14px}
button.clear{background:#e5484d}
a.dl{color:#2f6bff;font-size:13px;margin-left:10px;text-decoration:none}
.dev{color:#93a1b7;font-size:11px;line-height:1.7;padding:16px 16px 0;word-break:break-all}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,50,.9);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}

header{background:linear-gradient(135deg,#1e2a3a,#2f6bff)}
main{padding:16px}
h2{font-size:15px;margin:20px 0 8px;color:#5b6b84}
.note{background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;color:#5b6b84;line-height:1.7;box-shadow:0 1px 4px rgba(20,40,80,.06)}
.tin{width:100%;border:1px solid #dfe6f1;border-radius:10px;padding:10px;font-size:14px;margin-top:6px;outline:none;background:#fff}
.fld{margin-top:10px;font-size:13px;color:#5b6b84}
.nlist{max-height:260px;overflow:auto;border:1px solid #eef1f7;border-radius:12px;margin-top:10px;background:#fff}
.nrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f3f5f9;font-size:14px}
.nrow:last-child{border-bottom:0}
.nrow .idx{color:#9aa7bd;font-size:12px;width:30px;flex:none}
.nrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .del{color:#e5484d;font-weight:700;padding:4px 10px;cursor:pointer;flex:none}
.nok{color:#93a1b7;font-size:13px;padding:14px;text-align:center}
.hrow{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid #f0f3f8}
.hrow:last-child{border-bottom:0}
.hd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style></head><body>
<header>
  <h1>2617班 · 票数后台</h1>
  <div class="sub">每 15 秒自动刷新</div>
  <div><span class="pill" id="total">已投 0 票</span><span class="pill" id="left">剩余口令 59</span><span class="pill" id="dev">0 台设备</span></div>
</header>
<main>
  <h2>得票排行</h2>
  <div class="rows" id="rows"><div class="empty">加载中…</div></div>

  <h2>投票情况</h2>
  <div class="note" id="note">加载中…</div>

  <h2>投票设置</h2>
  <div class="note">
    <div class="fld">标题<input class="tin" id="ttl" placeholder="例如：2617班 优秀学生评选"></div>
    <div class="fld">副标题<input class="tin" id="sub" placeholder="例如：请选出 1 人"></div>
    <button class="act" id="saveCfg">保存标题</button>
    <div class="mini" style="margin-top:8px">保存后同学刷新投票页生效，不需要任何密钥。</div>
  </div>

  <h2>名单管理 <span class="mini" id="cnt"></span></h2>
  <div class="note">
    <input class="tin" id="qName" placeholder="搜索姓名（输入即筛选）">
    <div class="nlist" id="nameList"><div class="nok">加载中…</div></div>
    <div class="hd">
      <input class="tin" id="newName" placeholder="输入姓名，回车添加" style="flex:1;margin-top:0">
      <button class="act" id="addName" style="margin-top:0">添加</button>
    </div>
    <div class="hd">
      <button class="act" id="saveNames">保存名单</button>
      <button class="act" id="resetNames">恢复默认</button>
    </div>
    <div id="undoBar" style="display:none;margin-top:10px;font-size:13px">
      <span id="undoTxt"></span><a href="#" id="undo" style="color:#2f6bff;margin-left:8px;text-decoration:none">撤销</a>
    </div>
  </div>

  <h2>导入 / 导出</h2>
  <div class="note">
    <textarea id="imp" placeholder="①投票记录：每行 姓名,票数  ③历史结果：粘贴导出的 CSV" style="width:100%;height:100px;border:1px solid #dfe6f1;border-radius:10px;padding:10px;font-size:13px"></textarea>
    <div class="hd">
      <button class="act" id="impVote">① 导入投票记录</button>
      <button class="act" id="impHist">③ 导入历史结果</button>
      <button class="act clear" id="clrHist">清空历史对比</button>
    </div>
    <div class="hd">
      <a class="dl" id="dl" download="2617票数.csv">导出 CSV</a>
      <button class="act" id="reload">手动刷新</button>
      <button class="act clear" id="clear">清空投票数据</button>
    </div>
    <div class="mini" style="margin-top:8px">导出后文件存到手机：/storage/emulated/0/Download/</div>
  </div>

  <h2>历史对比</h2>
  <div class="rows" id="hist"><div class="empty">还没有导入历史数据</div></div>
  <div class="meta" id="meta"></div>
</main>
<script>var TOPIC="2617vote-2617";
function fetchAll(){
  return fetch("https://ntfy.sh/"+TOPIC+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var out={resetTs:0,votes:[],names:null,title:"",sub:""};
      var seen={};
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        var m,d;
        try{m=JSON.parse(l);}catch(e){return;}
        if(m.event!=="message"||!m.message)return;
        try{d=JSON.parse(m.message);}catch(e){return;}
        if(!d||typeof d!=="object")return;
        if(d.event==="reset"){ out.resetTs=Math.max(out.resetTs, d.ts||0); return; }
        if(d.event==="names"&&Array.isArray(d.list)&&d.list.length)out.names=d.list;
        if(d.event==="config"){ if(typeof d.title==="string")out.title=d.title; if(typeof d.sub==="string")out.sub=d.sub; }
      });
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        var m,d;
        try{m=JSON.parse(l);}catch(e){return;}
        if(m.event!=="message"||!m.message)return;
        try{d=JSON.parse(m.message);}catch(e){return;}
        if(!d||typeof d!=="object")return;
        if(!d.h||!d.name||d.name==="undefined")return;
        var ts=d.ts||m.time*1000;
        if(ts<=out.resetTs)return;
        if(seen[d.h])return;
        seen[d.h]=1;
        out.votes.push({h:d.h,name:d.name,ts:ts,dv:d.dv||"",md:d.md||"",imp:d.imp||0});
      });
      return out;
    });
}
function activeTopic(){return Promise.resolve(TOPIC);}
function readVotes(){
  return fetchAll().then(function(a){return a.votes;}).catch(function(){return [];});
}
function loadState(){
  return fetchAll().then(function(a){
    return {round:String(a.resetTs||0), title:a.title, sub:a.sub, names:a.names};
  }).catch(function(){return null;});
}
function topicFromState(){return TOPIC;}
function post(a,b){
  var body=b||a;
  return fetch("https://ntfy.sh/"+TOPIC,{method:"POST",body:JSON.stringify(body)});
}
function byName(votes){
  var c={},i;
  for(i=0;i<votes.length;i++){c[votes[i].name]=(c[votes[i].name]||0)+1;}
  return c;
}

var NAMES=[],DEF_NAMES=[],LAST_DEL=null,topic="",all=null;
var TOTAL_CODES=59;
function $(i){return document.getElementById(i);}
function pad(x){return ("0"+x).slice(-2);}
function render(v){
  var counts=byName(v),total=v.length;
  $("total").textContent="已投 "+total+" 票";
  $("left").textContent="剩余口令 "+Math.max(0,TOTAL_CODES-total);
  var dev={},uniq=0;
  v.forEach(function(x){ if(x.md){ if(!dev[x.md]){dev[x.md]=[];uniq++;} dev[x.md].push(x.name); } });
  $("dev").textContent=uniq+" 台设备";
  var items=Object.keys(counts).map(function(k){return [k,counts[k]];}).sort(function(a,b){return b[1]-a[1];});
  var max=items.length?items[0][1]:1;
  $("rows").innerHTML=items.length?items.map(function(x,i){
    var pct=total?(x[1]/total*100).toFixed(1):"0.0";
    return '<div class="row"><div class="rl"><span class="n">'+x[0]+(i===0?'<span class="top">领先</span>':'')+'</span><span class="v">'+x[1]+' 票 · '+pct+'%</span></div><div class="bar"><i style="width:'+(x[1]/max*100)+'%"></i></div></div>';
  }).join(""):'<div class="empty">还没有人投票</div>';
  var dup=Object.keys(dev).filter(function(k){return dev[k].length>1;});
  $("note").innerHTML="已用口令 <b>"+total+"</b> 个，剩余 <b>"+Math.max(0,TOTAL_CODES-total)+"</b> 个。<br>匿名：只记录口令，不记录谁投了谁。"+(dup.length?'<div style="color:#e5484d;margin-top:6px">⚠ 同一设备多次投票：'+dup.map(function(k){return k+"（"+dev[k].length+" 票）";}).join("、")+'</div>':'<div style="color:#00a878;margin-top:6px">✅ 未发现同一设备重复投票</div>');
  var last=v.slice().sort(function(a,b){return b.ts-a.ts;})[0];
  $("meta").textContent=last?("最近一票："+new Date(last.ts).toLocaleString("zh-CN")+" · 投给 "+last.name):"等待第一票…";
  var d=new Date();
  $("dl").download="2617票数_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+".csv";
  var csv="姓名,票数"+String.fromCharCode(10)+items.map(function(x){return x[0]+","+x[1];}).join(String.fromCharCode(10));
  $("dl").href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  renderHist(counts);
}
function load(){
  loadState().then(function(st){ return readVotes(topicFromState(st)); })
   .then(function(v){if(v)render(v);})
   .catch(function(){$("rows").innerHTML='<div class="empty">加载失败，稍后自动重试</div>';});
}
function renderNames(){
  var q=($("qName").value||"").trim();
  $("cnt").textContent="（"+NAMES.length+" 人）";
  var out=[];
  for(var i=0;i<NAMES.length;i++){
    if(q&&NAMES[i].indexOf(q)<0)continue;
    out.push('<div class="nrow"><span class="idx">'+(i+1)+'</span><span class="nm">'+NAMES[i]+'</span><span class="del" data-i="'+i+'">删除</span></div>');
  }
  $("nameList").innerHTML=out.length?out.join(""):'<div class="nok">'+(q?"没有匹配「"+q+"」":"名单为空")+'</div>';
  [].forEach.call($("nameList").querySelectorAll(".del"),function(el){
    el.onclick=function(){
      var i=parseInt(el.dataset.i,10),nm=NAMES[i];
      if(!confirm("确定从名单里删除「"+nm+"」？"))return;
      NAMES.splice(i,1);LAST_DEL={name:nm,idx:i};renderNames();
      $("undoBar").style.display="block";$("undoTxt").textContent="已删除「"+nm+"」";
    };
  });
}
function undoDel(){
  if(!LAST_DEL)return;
  NAMES.splice(LAST_DEL.idx,0,LAST_DEL.name);
  LAST_DEL=null;$("undoBar").style.display="none";renderNames();
}
function addName(){
  var v=($("newName").value||"").trim();
  if(!v)return;
  if(NAMES.indexOf(v)>=0){alert("「"+v+"」已经在名单里");return;}
  NAMES.push(v);$("newName").value="";renderNames();
}
function loadAdmin(){
  return Promise.all([loadState(), fetch("names.json?x="+Date.now()).then(function(r){return r.json();}).catch(function(){return [];})]).then(function(res){
    var st=res[0],dflt=res[1]||[];
    DEF_NAMES=dflt.filter(function(x){return typeof x==="string"&&x.trim();}).map(function(x){return x.trim();});
    NAMES=(st&&st.names&&st.names.length)?st.names.slice():DEF_NAMES.slice();
    if(st&&st.title)$("ttl").value=st.title;
    if(st&&st.sub)$("sub").value=st.sub;
    renderNames();
  });
}
function parseRows(text){
  var rows=[];
  (text||"").split(String.fromCharCode(10)).forEach(function(line){
    line=line.replace(/^\s+|\s+$/g,"");
    if(!line)return;
    var parts=line.split(/[,	]/).map(function(x){return x.replace(/^\s+|\s+$/g,"");});
    if(parts[0])rows.push(parts);
  });
  return rows;
}
function importVotes(){
  var rows=parseRows($("imp").value),tasks=[];
  rows.forEach(function(p){
    if(!p[0]||p[0]==="姓名")return;
    var n=parseInt(p[1]||"1",10); if(!(n>0))n=1;
    for(var k=0;k<n;k++)tasks.push(p[0]);
  });
  if(!tasks.length){alert("没解析到数据");return;}
  if(!confirm("导入 "+tasks.length+" 票到当前轮次？"))return;
  var i=0,fail=0;
  function next(){
    if(i>=tasks.length){alert("导入完成："+(tasks.length-fail)+" 票成功");$("imp").value="";load();return;}
    var nm=tasks[i++];
    post({h:"imp"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:nm,ts:Date.now(),imp:1})
      .then(function(r){if(!r.ok)fail++;next();}).catch(function(){fail++;next();});
  }
  next();
}
function histKey(){return "hist_2617_v1";}
function getHist(){try{return JSON.parse(localStorage.getItem(histKey())||"[]");}catch(e){return [];}}
function importHistory(){
  var rows=parseRows($("imp").value),data=[];
  rows.forEach(function(p){
    if(!p[0]||p[0]==="姓名")return;
    var n=parseInt(p[1]||"0",10);
    if(!isNaN(n))data.push([p[0],n]);
  });
  if(!data.length){alert("没解析到 姓名,票数");return;}
  var h=getHist();h.unshift({ts:Date.now(),label:new Date().toLocaleString("zh-CN"),rows:data});h=h.slice(0,5);
  try{localStorage.setItem(histKey(),JSON.stringify(h));}catch(e){}
  $("imp").value="";alert("已导入历史："+data.length+" 人");load();
}
function renderHist(counts){
  var h=getHist();
  if(!h.length){$("hist").innerHTML='<div class="empty">还没有导入历史数据</div>';return;}
  var latest=h[0],map={};
  latest.rows.forEach(function(r){map[r[0]]=r[1];});
  var names={};
  Object.keys(map).forEach(function(k){names[k]=1;});
  Object.keys(counts||{}).forEach(function(k){names[k]=1;});
  $("hist").innerHTML='<div class="mini" style="padding:6px 0">历史批次：'+latest.label+'</div>'+Object.keys(names).map(function(n){
    var o=map[n]||0,c=(counts||{})[n]||0,d=c-o;
    var col=d>0?"#00a878":(d<0?"#e5484d":"#93a1b7");
    return '<div class="hrow"><span>'+n+'</span><span class="mini">历史 '+o+' ｜ 本轮 '+c+' ｜ <b style="color:'+col+'">'+(d>0?"+":"")+d+'</b></span></div>';
  }).join("");
}
$("saveCfg").onclick=function(){
  var b=this;b.disabled=true;b.textContent="保存中…";
  post({event:"config",title:($("ttl").value||"").trim(),sub:($("sub").value||"").trim(),ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    alert("标题已保存，同学刷新投票页即可看到。");
  }).catch(function(e){alert("保存失败："+e.message);}).then(function(){b.disabled=false;b.textContent="保存标题";});
};
$("saveNames").onclick=function(){
  if(!NAMES.length){alert("名单不能为空");return;}
  var b=this;b.disabled=true;b.textContent="保存中…";
  post({event:"names",list:NAMES,ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    alert("名单已保存："+NAMES.length+" 人。同学刷新投票页即可看到。");
  }).catch(function(e){alert("保存失败："+e.message);}).then(function(){b.disabled=false;b.textContent="保存名单";});
};
$("clear").onclick=function(){
  var b=this;
  if(!confirm("清空后所有票数归零，已用口令恢复。确定清空吗？"))return;
  if(!confirm("再确认一次：真的要清空本轮投票数据？"))return;
  b.disabled=true;b.textContent="清空中…";
  post({event:"reset",ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    alert("已清空，同学刷新页面即可重新投票。");
    load();
  }).catch(function(e){alert("清空失败："+e.message);}).then(function(){b.disabled=false;b.textContent="清空投票数据";});
};
$("reload").onclick=load;
$("impVote").onclick=importVotes;
$("impHist").onclick=importHistory;
$("clrHist").onclick=function(){ if(confirm("清空本机历史对比？")){try{localStorage.removeItem(histKey());}catch(e){} load();} };
$("addName").onclick=addName;
$("newName").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addName();}});
$("qName").addEventListener("input",renderNames);
$("undo").onclick=function(e){e.preventDefault();undoDel();};
$("resetNames").onclick=function(){
  if(!DEF_NAMES.length){alert("默认名单未加载");return;}
  if(!confirm("恢复默认 "+DEF_NAMES.length+" 人名单？"))return;
  NAMES=DEF_NAMES.slice();renderNames();
};
loadAdmin().then(load);
setInterval(load,15000);
</script>
</body></html>
