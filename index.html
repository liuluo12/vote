<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2617班 · 投票</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;background:#f2f4f8;color:#16202e;padding-bottom:96px}
header{background:linear-gradient(135deg,#2f6bff,#00c2a8);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:21px}.sub{margin-top:6px;font-size:13px;opacity:.92}
.pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px}
.wrap{padding:14px}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;box-shadow:0 2px 8px rgba(20,40,80,.06);outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:2px solid transparent;border-radius:14px;padding:14px 4px;text-align:center;font-size:15px;font-weight:600;color:#1b2a41;box-shadow:0 1px 4px rgba(20,40,80,.06);transition:.15s;cursor:pointer;user-select:none}
.card:active{transform:scale(.96)}
.card.on{border-color:#2f6bff;background:#eef3ff;color:#1a4fd6;box-shadow:0 4px 14px rgba(47,107,255,.28)}
.card .idx{display:block;font-size:11px;font-weight:400;color:#9aa7bd;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-top:1px solid #e6eaf2;display:flex;align-items:center;gap:10px}
.sel{flex:1;font-size:14px;color:#5b6b84}.sel b{color:#16202e;font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#00a6ff);box-shadow:0 6px 16px rgba(47,107,255,.35)}
.btn:disabled{background:#c9d3e4;box-shadow:none;color:#f4f7fc}
#done{display:none;text-align:center;padding:40px 20px}
.big{font-size:52px;margin:0 0 10px}
.thanks{font-size:18px;font-weight:700;color:#00a878}
.t2{color:#5b6b84;font-size:14px;margin-top:6px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,50,.9);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
</style></head><body>
<header>
  <h1>2617班 · 人员投票</h1>
  <div class="sub">请从名单中选出 1 人（单选，一人一票）</div>
  <div class="pill" id="total">已投 0 票</div>
</header>
<div id="vote"><div class="wrap">
  <input class="search" id="q" placeholder="搜索姓名…" autocomplete="off">
  <div class="grid" id="grid"></div>
</div></div>
<div id="done"><div class="big">🎉</div><div class="thanks" id="thanks">投票成功</div><div class="t2" id="t2"></div><div class="t2" id="t3">感谢你的参与</div></div>
<footer id="foot">
  <div class="sel" id="sel">请选择一个人</div>
  <button class="btn" id="submit" disabled>投票</button>
</footer>
<div class="toast" id="toast"></div>
<script>
const TOPIC="2617vote-95c48b82f6ca";
let token=localStorage.getItem("vote_token_2617_r3");
if(!token){token="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem("vote_token_2617_r3",token);}
let sel=null,cur=[],voted=null,all=[];
const grid=document.getElementById("grid");
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600);}
function render(list){
  grid.innerHTML=list.length?list.map(n=>'<div class="card" data-n="'+n+'">'+n+'<span class="idx">'+(all.indexOf(n)+1)+'</span></div>').join(""):'<div style="grid-column:1/-1;text-align:center;color:#93a1b7;padding:26px">没有匹配的姓名</div>';
  [].forEach.call(grid.querySelectorAll(".card"),d=>{if(d.dataset.n===sel)d.classList.add("on");});
}
function finish(name,total){
  voted=name;localStorage.setItem("vote_done_2617_r3",name);
  document.getElementById("vote").style.display="none";
  document.getElementById("foot").style.display="none";
  document.getElementById("done").style.display="block";
  document.getElementById("t2").textContent="你投给了："+name;
  if(total!==null&&total!==undefined)document.getElementById("total").textContent="已投 "+total+" 票";
}
async function countAll(){
  try{
    const r=await fetch("https://ntfy.sh/"+TOPIC+"/json?poll=1");
    const t=await r.text();
    let n=0;const seen={};
    t.split("\n").forEach(l=>{if(!l.trim())return;try{const m=JSON.parse(l);if(m.event==="message"){const d=JSON.parse(m.message);seen[d.id]=d;}}catch(e){}});
    return Object.keys(seen).length;
  }catch(e){return null;}
}
document.getElementById("q").addEventListener("input",e=>{
  const k=e.target.value.trim();
  cur=k?all.filter(n=>n.indexOf(k)>=0):all.slice();render(cur);
});
grid.addEventListener("click",e=>{
  const d=e.target.closest(".card");if(!d)return;
  sel=d.dataset.n;render(cur);
  document.getElementById("sel").innerHTML="已选：<b>"+sel+"</b>";
  document.getElementById("submit").disabled=false;
});
document.getElementById("submit").addEventListener("click",async()=>{
  if(!sel||voted)return;
  if(!confirm("确认投给 "+sel+" ？提交后不能修改"))return;
  const b=document.getElementById("submit");b.disabled=true;b.textContent="提交中…";
  try{
    const payload=JSON.stringify({id:token,name:sel,ts:Date.now()});
    const r=await fetch("https://ntfy.sh/"+TOPIC,{method:"POST",body:payload});
    if(r.ok){const t=await countAll();finish(sel,t);}
    else{toast("提交失败("+r.status+")，请重试");b.disabled=false;b.textContent="投票";}
  }catch(e){toast("网络错误，请重试");b.disabled=false;b.textContent="投票";}
});
(async()=>{
  try{all=await (await fetch("names.json")).json();}catch(e){all=[];toast("名单加载失败");}
  cur=all.slice();render(cur);
  const m=localStorage.getItem("vote_done_2617_r3");
  if(m){finish(m,null);}
  const t=await countAll();
  if(t!==null)document.getElementById("total").textContent="已投 "+t+" 票";
})();
</script>
</body></html>
