<script>
var BASE="__BASE__", CTL="__CTL__";

function activeTopic(){
  return fetch("https://ntfy.sh/"+CTL+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var last=null;
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event==="message"&&m.message){
            var d=JSON.parse(m.message);
            if(d.event==="reset"&&m.id)last=m.id;
          }
        }catch(e){}
      });
      return last?(BASE+last):null;
    });
}
function readVotes(topic){
  return fetch("https://ntfy.sh/"+topic+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var seen={},order=[];
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event!=="message"||!m.message)return;
          var d=JSON.parse(m.message);
          if(!d||typeof d!=="object")return;
          if(d.event==="reset")return;
          if(!d.h||!d.name||d.name==="undefined"||d.h==="undefined")return;
          if(!seen[d.h]){seen[d.h]={h:d.h,name:d.name,ts:d.ts||m.time*1000};order.push(seen[d.h]);}
        }catch(e){}
      });
      return order;
    });
}
function post(topic,obj){
  return fetch("https://ntfy.sh/"+topic,{method:"POST",body:JSON.stringify(obj)});
}
function byName(votes){
  var c={},i,v;
  for(i=0;i<votes.length;i++){v=votes[i];c[v.name]=(c[v.name]||0)+1;}
  return c;
}

function sha256hex(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result="",words=[],asciiBitLength=ascii.length*8;
  var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],primeCounter=k.length,isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while(ascii.length%64-56)ascii+="\x00";
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8)return;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++){
    for(var j2=3;j2+1;j2--){
      var b=(hash[i]>>(j2*8))&255;
      result+=((b<16)?"0":"")+b.toString(16);
    }
  }
  return result;
}

  e.target.value=e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,"");

  try{
    var c=($("code").value||"").trim().toUpperCase();
    if(c.length<6){setStatus("status","口令应为 6 位字符","bad");return;}
    if(!hashes||!hashes.length){setStatus("status","口令表未加载，请刷新页面","bad");return;}
    var h=sha256hex(c);
    if(hashes.indexOf(h)<0){setStatus("status","口令无效，请核对后重输","bad");return;}
    var used=votes.filter(function(x){return x.h===h;})[0];
    if(used){setStatus("status","这个口令已经用过了","bad");showDone(used.name,votes.length);return;}
    myHash=h;
    if(!all.length){loadNames().then(function(){if(all.length)enterStep1();else setStatus("status","名单加载失败，请刷新","bad");});return;}

  }catch(e){

$("submit").addEventListener("click",function(){
  if(!myHash||!target)return;
  if(!confirm("确认投给 "+target+" ？提交后不能修改"))return;
  var b=$("submit");b.disabled=true;b.textContent="提交中…";
  post(topic,{h:myHash,name:target,ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    return refresh();
  }).then(function(v){showDone(target,v.length);})
   .catch(function(e){toast("提交失败："+(e&&e.message?e.message:""));b.disabled=false;b.textContent="投票";});
});
setInterval(function(){
  activeTopic().then(function(t){
    if(t&&topic&&t!==topic){topic=t;toast("投票已重置，请重新投票");
      try{localStorage.removeItem("vote_hash_2617");}catch(e){}
      myHash=null;target=null;
      $("step0").style.display="block";$("step1").style.display="none";$("done").style.display="none";
      $("foot").style.display="none";$("code").value="";setStatus("status","");refresh();}
    else refresh();
  }).catch(function(){});
},15000);
boot();
</script>
</body></html>
