<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2617班 · 投票</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;background:#f2f4f8;color:#16202e}
header{background:linear-gradient(135deg,#2f6bff,#00c2a8);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:21px}
.sub{margin-top:6px;font-size:13px;opacity:.92}
.pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px;margin-right:8px}
.wrap{padding:14px}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;outline:none;box-shadow:0 2px 8px rgba(20,40,80,.06)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:2px solid transparent;border-radius:14px;padding:14px 6px;text-align:center;font-size:15px;font-weight:600;color:#1b2a41;box-shadow:0 1px 4px rgba(20,40,80,.06);cursor:pointer;user-select:none;overflow-wrap:anywhere}
.card.on{border-color:#2f6bff;background:#eef3ff;color:#1a4fd6}
.card .idx{display:block;font-size:11px;font-weight:400;color:#9aa7bd;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid #e6eaf2;display:flex;align-items:center;gap:10px}
.sel{flex:1;font-size:14px;color:#5b6b84}
.sel b{color:#16202e;font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#00a6ff)}
.btn:disabled{background:#c9d3e4}
#done{display:none;text-align:center;padding:44px 20px}
.big{font-size:52px;margin:0 0 10px}
.thanks{font-size:18px;font-weight:700;color:#00a878}
.t2{color:#5b6b84;font-size:14px;margin-top:6px}
.rows{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 2px 10px rgba(20,40,80,.06);margin-top:14px}
.row{padding:11px 0;border-bottom:1px solid #f0f3f8}
.row:last-child{border-bottom:0}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.n{font-weight:600}
.v{color:#5b6b84;font-size:13px}
.bar{height:9px;border-radius:6px;background:#eef1f7;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6bff,#00c2a8);transition:width .4s}
.top{color:#d97706;font-size:12px;margin-left:6px;font-weight:700}
.empty{text-align:center;color:#93a1b7;padding:30px 0;font-size:14px}
.meta{color:#8a97ac;font-size:12px;margin-top:14px;line-height:1.7;word-break:break-all}
button.act{border:0;background:#2f6bff;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;margin-top:14px}
button.clear{background:#e5484d}
a.dl{color:#2f6bff;font-size:13px;margin-left:10px;text-decoration:none}
.dev{color:#93a1b7;font-size:11px;line-height:1.7;padding:16px 16px 0;word-break:break-all}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,50,.9);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}

body{padding-bottom:96px}
.hint{font-size:14px;color:#5b6b84;margin:0 4px}
.hint b{color:#16202e;font-size:15px}
.hint a{color:#2f6bff;font-size:13px;margin-left:8px;text-decoration:none}
#step0,#step1,#step2{padding:14px}
.codebox{width:100%;border:0;border-radius:14px;padding:16px;font-size:22px;letter-spacing:6px;text-align:center;text-transform:uppercase;background:#fff;box-shadow:0 2px 8px rgba(20,40,80,.06);outline:none;font-weight:700}
.go{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#00a6ff)}
.tip{font-size:12px;color:#93a1b7;margin-top:10px;line-height:1.7;text-align:center}
</style></head><body>
<header>
  <h1>2617班 · 人员投票</h1>
  <div class="sub">匿名投票：先输入你的口令，再投给 1 人（每人一票）</div>
  <div class="pill" id="total">已投 0 票</div>
</header>
<div id="step0">
  <div class="hint"><b>第 1 步：输入你的口令</b></div>
  <div style="margin-top:12px"><input class="codebox" id="code" placeholder="XXXXXX" maxlength="6" autocomplete="off"></div>
  <button class="go" id="check">验证口令</button>
  <div class="tip">口令是老师发给你的一串 6 位字符（如 9W6JLT）<br>每个口令只能用一次；系统只记录口令，不记录你的姓名</div>
</div>
<div id="step1" style="display:none">
  <div class="hint"><b>第 2 步：投给谁？</b><a href="#" id="back">换口令</a></div>
  <div style="margin-top:12px"><input class="search" id="q2" placeholder="搜索姓名…" autocomplete="off"></div>
  <div class="grid" id="grid2"></div>
</div>
<div id="done"><div class="big">🎉</div><div class="thanks">投票成功</div><div class="t2" id="t2"></div><div class="t2">感谢你的参与</div></div>
<footer id="foot" style="display:none">
  <div class="sel" id="sel">请选择要投的人</div>
  <button class="btn" id="submit" disabled>投票</button>
</footer>
<div class="toast" id="toast"></div>
<script>
var BASE="__BASE__", CTL="__CTL__";

function activeTopic(){
  return fetch("https://ntfy.sh/"+CTL+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var last=null;
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event==="message"&&m.message){
            var d=JSON.parse(m.message);
            if(d.event==="reset"&&m.id)last=m.id;
          }
        }catch(e){}
      });
      return last?(BASE+last):null;
    });
}
function readVotes(topic){
  return fetch("https://ntfy.sh/"+topic+"/json?poll=1&since=all&x="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      var seen={},order=[];
      t.split("\n").forEach(function(l){
        if(!l.trim())return;
        try{
          var m=JSON.parse(l);
          if(m.event!=="message"||!m.message)return;
          var d=JSON.parse(m.message);
          if(!d||typeof d!=="object")return;
          if(d.event==="reset")return;
          if(!d.h||!d.name||d.name==="undefined"||d.h==="undefined")return;
          if(!seen[d.h]){seen[d.h]={h:d.h,name:d.name,ts:d.ts||m.time*1000};order.push(seen[d.h]);}
        }catch(e){}
      });
      return order;
    });
}
function post(topic,obj){
  return fetch("https://ntfy.sh/"+topic,{method:"POST",body:JSON.stringify(obj)});
}
function byName(votes){
  var c={},i,v;
  for(i=0;i<votes.length;i++){v=votes[i];c[v.name]=(c[v.name]||0)+1;}
  return c;
}

var all=[],votes=[],topic=null,hashes=[],myHash=null,target=null;
function $(i){return document.getElementById(i);}
function toast(t){var e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(function(){e.style.opacity=0},1800);}
async function sha256(s){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(function(b){return ("0"+b.toString(16)).slice(-2);}).join("");
}
function draw(list,sel,onclick){
  var el=$("grid2");
  el.innerHTML=(list&&list.length)?list.map(function(n){return '<div class="card" data-n="'+n+'">'+n+'</div>';}).join(""):'<div style="grid-column:1/-1;text-align:center;color:#93a1b7;padding:26px">没有匹配的姓名</div>';
  [].forEach.call(el.querySelectorAll(".card"),function(d){
    if(d.dataset.n===sel)d.classList.add("on");
    d.onclick=function(){onclick(d.dataset.n);};
  });
}
function showDone(name,total){
  $("step0").style.display="none";$("step1").style.display="none";$("step2").style.display="none";
  $("foot").style.display="none";$("done").style.display="block";
  $("t2").textContent="你投给了："+name;
  if(total!==undefined&&total!==null)$("total").textContent="已投 "+total+" 票";
  try{localStorage.setItem("vote_hash_2617",myHash||"");localStorage.setItem("vote_pick_2617",name);}catch(e){}
}
function enterStep1(){
  $("step0").style.display="none";$("done").style.display="none";$("step2").style.display="none";
  $("step1").style.display="block";$("foot").style.display="flex";
  $("sel").textContent="请选择要投的人";$("submit").disabled=true;target=null;
  draw(all,null,pick);
}
function pick(n){
  target=n;$("sel").innerHTML="投给：<b>"+n+"</b>";$("submit").disabled=false;
  [].forEach.call($("grid2").querySelectorAll(".card"),function(d){d.classList.toggle("on",d.dataset.n===n);});
}
function refresh(){
  if(!topic)return Promise.resolve([]);
  return readVotes(topic).then(function(v){
    votes=v;$("total").textContent="已投 "+v.length+" 票";return v;
  }).catch(function(){return [];});
}
async function boot(){
  try{hashes=(await (await fetch("hashes.json?x="+Date.now())).json()).hashes||[];}catch(e){hashes=[];}
  try{all=(await (await fetch("names.json?x="+Date.now())).json()).filter(function(x){return typeof x==="string"&&x.trim();}).map(function(x){return x.trim();});}catch(e){all=[];}
  topic=await activeTopic();
  if(!topic){toast("投票尚未开始");return;}
  await refresh();
  var saved=null;
  try{saved=localStorage.getItem("vote_hash_2617");}catch(e){}
  if(saved){
    myHash=saved;
    var mine=votes.filter(function(x){return x.h===saved;})[0];
    if(mine){showDone(mine.name,votes.length);return;}
  }
  $("step0").style.display="block";$("step1").style.display="none";$("done").style.display="none";
}
$("code").addEventListener("input",function(e){
  e.target.value=e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,"");
});
$("check").addEventListener("click",async function(){
  var c=($("code").value||"").trim().toUpperCase();
  if(c.length<6){toast("口令是 6 位");return;}
  var h=await sha256(c);
  if(!hashes.length){toast("口令表加载失败，请刷新");return;}
  if(hashes.indexOf(h)<0){toast("口令无效，请核对");return;}
  var used=votes.filter(function(x){return x.h===h;})[0];
  if(used){toast("这个口令已经用过了");showDone(used.name,votes.length);return;}
  myHash=h;enterStep1();
});
$("back").addEventListener("click",function(e){e.preventDefault();myHash=null;target=null;
  $("step1").style.display="none";$("foot").style.display="none";$("step0").style.display="block";});
$("q2").addEventListener("input",function(e){
  var k=e.target.value.trim();
  draw(k?all.filter(function(n){return n.indexOf(k)>=0;}):all,target,pick);
});
$("submit").addEventListener("click",function(){
  if(!myHash||!target)return;
  if(!confirm("确认投给 "+target+" ？提交后不能修改"))return;
  var b=$("submit");b.disabled=true;b.textContent="提交中…";
  post(topic,{h:myHash,name:target,ts:Date.now()}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    return refresh();
  }).then(function(v){
    showDone(target,v.length);
  }).catch(function(){toast("提交失败，请重试");b.disabled=false;b.textContent="投票";});
});
setInterval(function(){
  activeTopic().then(function(t){
    if(t&&topic&&t!==topic){topic=t;toast("投票已重置，请重新投票");
      try{localStorage.removeItem("vote_hash_2617");localStorage.removeItem("vote_pick_2617");}catch(e){}
      myHash=null;target=null;$("step0").style.display="block";$("step1").style.display="none";$("done").style.display="none";$("foot").style.display="none";$("code").value="";refresh();}
    else refresh();
  }).catch(function(){});
},15000);
boot();
</script>
</body></html>
